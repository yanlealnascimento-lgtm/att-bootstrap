<div class="container pb-5">
  <button type="button" class="btn btn-outline-dark" data-bs-toggle="modal" data-bs-target="#aviso">Ver aviso sobre receitas</button>
  <div class="modal fade" id="aviso" tabindex="-1" aria-labelledby="aviso-titulo" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h2 class="modal-title h5" id="aviso-titulo">Venda de medicamentos controlados</h2>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
        </div>
        <div class="modal-body">
          <p class="mb-0">Medicamentos de tarja preta só são vendidos com receita retida dentro do prazo de validade e documento de identificação do comprador.</p>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Fechar</button>
          <button type="button" class="btn btn-success" data-bs-dismiss="modal">Entendi</button>
        </div>
      </div>
    </div>
  </div>
</div>
